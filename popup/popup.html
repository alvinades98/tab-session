<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiSession Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="4" width="13" height="13" rx="3" fill="#faae2b"/>
        <rect x="9" y="7" width="13" height="13" rx="3" fill="#f36c21"/>
      </svg>
      <span>MultiSession</span>
    </div>
    <button id="btn-options" class="icon-btn" title="Pengaturan" aria-label="Pengaturan">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <section class="current">
    <div class="current-row">
      <span id="current-domain" class="domain">Memuat...</span>
      <div class="segmented">
        <button class="seg-btn active" id="btn-scope-tab" title="Ganti session hanya untuk tab ini">Tab</button>
        <button class="seg-btn" id="btn-scope-domain" title="Ganti session untuk semua tab website ini">Website</button>
      </div>
    </div>
    <div class="current-session">
      <span class="dot" id="current-session-dot"></span>
      <span id="current-session-icon">👤</span>
      <span id="current-session-name">Default</span>
    </div>
  </section>

  <div class="search" id="search-wrap" hidden>
    <input type="text" id="search-input" placeholder="Cari session..." autocomplete="off">
  </div>

  <ul class="list" id="session-list"></ul>

  <footer class="footer">
    <button id="btn-add-session" class="text-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Session baru
    </button>
    <div class="footer-right">
      <button id="btn-sync" class="icon-btn" title="Simpan cookie session aktif" aria-label="Simpan cookie">
        <svg class="sync-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      </button>
      <button id="btn-clear-domain" class="icon-btn danger" title="Reset cookie website ini" aria-label="Reset cookie">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>
  </footer>

  <!-- Add / Edit Session -->
  <div class="overlay" id="modal-overlay">
    <form class="sheet" id="session-form">
      <h3 id="modal-title">Session baru</h3>
      <input type="hidden" id="form-session-id" value="">
      <input type="text" id="form-session-name" placeholder="Nama session, cth: Akun Kantor" required maxlength="30">

      <div class="picker" id="icon-picker">
        <button type="button" class="icon-opt" data-icon="👤">👤</button>
        <button type="button" class="icon-opt" data-icon="💼">💼</button>
        <button type="button" class="icon-opt" data-icon="⚡">⚡</button>
        <button type="button" class="icon-opt" data-icon="🛒">🛒</button>
        <button type="button" class="icon-opt" data-icon="🎮">🎮</button>
        <button type="button" class="icon-opt" data-icon="🔐">🔐</button>
        <button type="button" class="icon-opt" data-icon="🌐">🌐</button>
        <button type="button" class="icon-opt" data-icon="🚀">🚀</button>
        <button type="button" class="icon-opt" data-icon="📦">📦</button>
        <button type="button" class="icon-opt" data-icon="🧪">🧪</button>
      </div>

      <div class="picker" id="color-picker">
        <button type="button" class="color-opt" data-color="#faae2b" style="--c:#faae2b"></button>
        <button type="button" class="color-opt" data-color="#f36c21" style="--c:#f36c21"></button>
        <button type="button" class="color-opt" data-color="#2ecc71" style="--c:#2ecc71"></button>
        <button type="button" class="color-opt" data-color="#38bdf8" style="--c:#38bdf8"></button>
        <button type="button" class="color-opt" data-color="#ff6584" style="--c:#ff6584"></button>
        <button type="button" class="color-opt" data-color="#a78bfa" style="--c:#a78bfa"></button>
        <button type="button" class="color-opt" data-color="#f43f5e" style="--c:#f43f5e"></button>
        <button type="button" class="color-opt" data-color="#84cc16" style="--c:#84cc16"></button>
      </div>

      <div class="sheet-actions">
        <button type="button" id="btn-cancel-modal" class="btn ghost">Batal</button>
        <button type="submit" class="btn primary">Simpan</button>
      </div>
    </form>
  </div>

  <!-- Confirmation -->
  <div class="overlay" id="confirm-modal-overlay">
    <div class="sheet">
      <h3 id="dialog-title">Konfirmasi</h3>
      <p id="dialog-message" class="dialog-message"></p>
      <div class="sheet-actions">
        <button type="button" id="btn-dialog-cancel" class="btn ghost">Batal</button>
        <button type="button" id="btn-dialog-confirm" class="btn danger">Hapus</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
